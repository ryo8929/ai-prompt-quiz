<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f2eb"><title>AIへの伝え方｜やさしい○×クイズ</title><meta name="description" content="AIへの指示のコツを、やさしい10問の○×クイズで学ぼう。登録不要でスマホから遊べます。"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#253f36;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;line-height:1.8}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #d48336;outline-offset:5px}header{max-width:1080px;margin:auto;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dcded3}.brand{font-weight:800;letter-spacing:.06em}.tag{font-size:12px;border:1px solid #cad3c7;border-radius:100px;padding:3px 12px}main{max-width:780px;margin:0 auto;padding:42px 22px 60px}.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:700;color:#6a7d6e}h1{font-size:clamp(27px,5vw,40px);line-height:1.5;margin:12px 0} .intro{color:#6a766c;margin:0 0 26px;font-size:14px}.card{background:#fffefa;border:1px solid #dfe2d7;border-radius:24px;padding:32px;box-shadow:0 10px 40px #30473608}.meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#68786d}.track{height:6px;background:#e8ede4;border-radius:99px;margin:14px 0 28px;overflow:hidden}.bar{height:100%;background:#4c7660;transition:width .3s}h2{font-size:clamp(21px,4vw,28px);line-height:1.7;margin:12px 0 24px}.category{font-size:12px;color:#50715c;background:#edf3e9;padding:4px 12px;border-radius:99px;display:inline-block}.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px}.choice{border:1.5px solid #cad6c6;border-radius:16px;background:#f5f8f0;color:#2f6049;padding:13px 10px}.choice span{display:block;font-size:48px;font-weight:500;line-height:1.3}.choice small{font-size:13px}.choice:hover:not(:disabled){background:#e4efdd;transform:translateY(-2px)}.choice:disabled{cursor:default;opacity:.55}.choice.selected{opacity:1;border:2px solid #3f6b51;background:#e8f0df}.hint{text-align:center;font-size:12px;color:#7a847a;margin:16px 0 0}.feedback{margin-top:24px;background:#edf4e7;border-radius:16px;padding:20px}.feedback.wrong{background:#fff1df}.feedback strong{font-size:19px}.feedback p{margin:8px 0;font-size:14px}.example{border-top:1px solid #cddac8;padding-top:12px;color:#46634e}.primary{display:block;width:100%;background:#2e5743;color:white;border:0;border-radius:12px;padding:13px 20px;margin-top:20px;font-weight:700}.primary:hover{background:#1e4431}.secondary{background:transparent;color:#3c5947;border:1px solid #bdcabb}.score{font-size:64px;line-height:1.2;margin:18px 0;color:#365f47}.score small{font-size:20px;color:#7c887c}.review{border-top:1px solid #e1e6db;padding:18px 0}.review p{font-size:14px;margin:5px 0}.review b{font-size:15px}.badge{font-size:12px;color:#6b7b69}.footer{text-align:center;font-size:12px;color:#7e897b;margin-top:25px}[hidden]{display:none!important}@media(max-width:540px){main{padding-top:28px}.card{padding:22px 18px}header{padding:18px 22px}.tag{font-size:10px}.choices{gap:12px}}
</style></head><body><header><div class="brand">AIへの伝え方<span style="color:#76916f">.</span></div><span class="tag">はじめてのAI入門</span></header><main><div class="eyebrow">LEARN WITH A LITTLE QUIZ</div><h1>伝え方を変えると、<br>AIがもっと役に立つ。</h1><p class="intro">むずかしい言葉はなし。○×で、指示のコツを学ぼう。<br>全10問・約3分 ／ 登録不要</p><section class="card" id="quiz" aria-label="AIへの指示のクイズ"></section><div class="footer">間違えても大丈夫。ひとつ覚えたら、それで一歩前進。</div></main><script>
'use strict';
const questions=[
{tag:'目的を伝える',q:'AIにお願いするときは、「何のために使うか」も伝えるとよい。',a:true,why:'目的がわかると、AIは使う場面に合わせて答えやすくなります。',ex:'「友だちを誕生日会に誘うための、短いメッセージを考えて」'},
{tag:'具体的に伝える',q:'「いい感じにして」とだけ言えば、いつも思いどおりの答えになる。',a:false,why:'「いい感じ」は人によって違います。雰囲気や長さを具体的に伝えましょう。',ex:'「やさしい言葉で、3行くらいにまとめて」'},
{tag:'相手を伝える',q:'「小学生にもわかるように」と、説明を読む相手を伝えてよい。',a:true,why:'誰に向けた説明かを伝えると、言葉のむずかしさを合わせやすくなります。',ex:'「インターネットのしくみを、小学生にもわかる言葉で説明して」'},
{tag:'形を指定する',q:'箇条書きで答えてほしいときは、「箇条書きで」とお願いしてよい。',a:true,why:'答えの形も指定できます。表・箇条書き・メール文など、使いやすい形を伝えましょう。',ex:'「持ち物を、箇条書きで5つ教えて」'},
{tag:'長さを指定する',q:'短い答えがほしいときも、長さは伝えないほうがよい。',a:false,why:'「3行で」「100文字くらいで」など、目安を伝えると使いやすくなります。文字数は最後に確認しましょう。',ex:'「この文章を、3行で短くまとめて」'},
{tag:'あとから直す',q:'答えが少し違ったら、「もっと短くして」と追加で頼んでよい。',a:true,why:'一度で完成させなくても大丈夫です。直してほしいところを伝えて、少しずつ整えましょう。',ex:'「もう少し短くして。かたい言葉も、やさしく言い換えて」'},
{tag:'例を見せる',q:'お手本の文章を見せると、ほしい答えの雰囲気が伝わりやすい。',a:true,why:'例があると、言葉づかいや答えの形を伝えやすくなります。見せる内容に秘密がないかは確認しましょう。',ex:'「『今日は来てくれてありがとう！』のような、親しみやすい文にして」'},
{tag:'答えを確かめる',q:'AIの答えなら、調べずに全部正しいと思ってよい。',a:false,why:'AIも間違えることがあります。大切な情報や日付・数字は、公式の情報などで確認しましょう。',ex:'「確認できる公式の情報源も教えて」→ 紹介された情報源を自分でも確認。'},
{tag:'秘密を守る',q:'質問するとき、パスワードも一緒に送るとよい。',a:false,why:'パスワードや他人の個人情報は送らないようにしましょう。説明に必要なら、仮の内容に置き換えます。',ex:'「名前はAさん、住所は〇〇として、この案内文を直して」'},
{tag:'聞き返してもらう',q:'条件が足りないときは、「先に質問して」とAIに頼んでよい。',a:true,why:'必要なことを先に聞いてもらうと、自分でも条件を整理しやすくなります。',ex:'「旅行の予定を考えたいです。足りない条件があれば、先に質問して」'}
];
let order=[],answers=[],pos=0,mode='all';const root=document.getElementById('quiz');
function start(indices=questions.map((_,i)=>i),kind='all'){order=[...indices];answers=[];pos=0;mode=kind;render();}
function render(){const x=questions[order[pos]];root.innerHTML=`<div class="meta"><span>${mode==='retry'?'まちがえた問題に再挑戦':'やさしい ○×クイズ'}</span><span>QUESTION ${String(pos+1).padStart(2,'0')} / ${order.length}</span></div><div class="track" role="progressbar" aria-label="回答の進み具合" aria-valuemin="0" aria-valuemax="${order.length}" aria-valuenow="${pos}"><div class="bar" style="width:${pos/order.length*100}%"></div></div><span class="category">${x.tag}</span><h2 id="question" tabindex="-1">${x.q}</h2><div class="choices"><button class="choice" data-value="true" aria-label="まる、そう思う"><span aria-hidden="true">○</span><small>そう思う</small></button><button class="choice" data-value="false" aria-label="ばつ、そう思わない"><span aria-hidden="true">×</span><small>そう思わない</small></button></div><p class="hint">どちらかを選んでね</p><div id="feedback" aria-live="polite"></div>`;root.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>answer(b.dataset.value==='true',b)));}
function answer(value,button){if(answers.length>pos)return;const x=questions[order[pos]],ok=value===x.a;answers.push(ok);root.querySelectorAll('.choice').forEach(b=>b.disabled=true);button.classList.add('selected');root.querySelector('.hint').hidden=true;root.querySelector('.bar').style.width=(pos+1)/order.length*100+'%';root.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',pos+1);document.getElementById('feedback').innerHTML=`<div class="feedback ${ok?'':'wrong'}"><strong>${ok?'正解！':'おしい！'} 答えは ${x.a?'○':'×'}</strong><p>${x.why}</p><p class="example">💡 こんなふうに伝えよう<br>${x.ex}</p></div><button class="primary" id="next">${pos===order.length-1?'結果を見る':'次の問題へ →'}</button>`;document.getElementById('next').onclick=()=>{pos++;if(pos===order.length)finish();else{render();document.getElementById('question').focus();}};}
function finish(){const score=answers.filter(Boolean).length,missed=order.filter((_,i)=>!answers[i]);root.innerHTML=`<div class="eyebrow">QUIZ COMPLETE</div><h2 tabindex="-1" id="result">${score===order.length?'すばらしい！全問正解。':'おつかれさま！一歩前進。'}</h2><div class="score">${score}<small> / ${order.length} 問正解</small></div><p>今日のコツは、<b>「目的・相手・形」を伝えること。</b><br>答えを見ながら、あとから直しても大丈夫。</p>${missed.length?'<button class="primary" id="retry">まちがえた問題だけ、もう一度</button>':''}<button class="primary ${missed.length?'secondary':''}" id="restart">最初から10問に挑戦</button><h3>覚えておきたいポイント</h3>${order.map((n,i)=>`<div class="review"><span class="badge">${answers[i]?'○ 正解':'↻ おさらい'} ／ ${questions[n].tag}</span><p><b>${questions[n].q} → ${questions[n].a?'○':'×'}</b></p><p>${questions[n].why}</p></div>`).join('')}`;document.getElementById('restart').onclick=()=>start();if(missed.length)document.getElementById('retry').onclick=()=>{start(missed,'retry');document.getElementById('question').focus();};document.getElementById('result').focus();}
start();
</script></body></html>
